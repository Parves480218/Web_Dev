<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Registration Page</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>
  <!--
    Author: Ville Heikkiniemi
    Date: 2025-10-06
  -->

  <header class="site-header">
    <h1>Registration Page</h1>
  </header>

  <main class="content">
    <div class="top-grid">
      <!-- Student info (30%) -->
      <section class="student-info" aria-label="Student information">
        <h2 class="student-info-title">Information</h2>
        <p><span class="student-name">Parves Mosharof Imran</span></p>
        <p><span class="student-group">AITS24P</span></p>
      </section>

      <!-- Controls / Form (70%) -->
      <section class="controls" aria-label="Registration Form">
        <h2 class="controls-title">Register</h2>

        <form id="addCourseForm">
          <!-- Hidden timestamp -->
          <input type="hidden" id="timestamp" name="timestamp">

          <!-- Full Name -->
          <div class="form-row">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Your full name">
          </div>

          <!-- Email -->
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="example@mail.com">
          </div>

          <!-- Phone -->
          <div class="form-row">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" placeholder="+358 401234567">
          </div>

          <!-- Birth Date -->
          <div class="form-row">
            <label for="birthDate">Birth Date</label>
            <input id="birthDate" name="birthDate" type="date">
          </div>

          <!-- Terms -->
          <div class="form-row">
            <label>
              <input type="checkbox" id="terms" name="terms"> I accept the terms
            </label>
          </div>

          <!-- Buttons -->
          <div class="form-row">
            <button id="addRowBtn" type="submit" class="btn">Submit</button>
            <button id="clearBtn" type="reset" class="btn btn-secondary">Clear</button>
          </div>

          <!-- Error messages -->
          <div id="errorMessages"></div>
        </form>
      </section>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="table" id="timetable">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Birth Date</th>
            <th>Terms Accepted</th>
          </tr>
        </thead>
        <tbody>
          <!-- Form submissions will appear here -->
        </tbody>
      </table>
    </div>
  </main>
</body>

</html>
